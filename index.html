<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>헤리티지 옷장</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2f4a6d"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="헤리티지 옷장">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Phone-first port of HERITAGE STUDIO v3. Sticky header with 5 tabs; each tab is one column of cards.
   Secondary work (editing, rating, comparing) opens in a bottom sheet so the main screens stay calm. */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --fg:#1f2328; --muted:#6b6f75; --line:#dcd8cf;
  --accent:#2f4a6d; --accent-fg:#ffffff; --brass:#9a7428; --soft:#f1ede4;
  --ok-bg:#e3efe3; --ok-fg:#25562b; --warn-bg:#fbefc9; --warn-fg:#6e4f00; --err-bg:#f8e1df; --err-fg:#8a2a22;
  --tag-bg:#f7f1e3; --tag-fg:#3a2f1a; --barbg:#e7e3da;
  --font-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171a; --surface:#1e2126; --fg:#e8e6e1; --muted:#9a9ea5; --line:#33373e;
  --accent:#8fb0db; --accent-fg:#10151c; --brass:#d2a956; --soft:#262a30;
  --ok-bg:#1f3524; --ok-fg:#a7d8ae; --warn-bg:#3d3216; --warn-fg:#f1d38a; --err-bg:#3b1f1d; --err-fg:#f2b8b2;
  --tag-bg:#2c2718; --tag-fg:#f0e2c0; --barbg:#2a2d33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171a; --surface:#1e2126; --fg:#e8e6e1; --muted:#9a9ea5; --line:#33373e;
  --accent:#8fb0db; --accent-fg:#10151c; --brass:#d2a956; --soft:#262a30;
  --ok-bg:#1f3524; --ok-fg:#a7d8ae; --warn-bg:#3d3216; --warn-fg:#f1d38a; --err-bg:#3b1f1d; --err-fg:#f2b8b2;
  --tag-bg:#2c2718; --tag-fg:#f0e2c0; --barbg:#2a2d33; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hrow{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em;white-space:nowrap}
h1 small{font-weight:500;color:var(--brass);font-size:11px;margin-left:6px;letter-spacing:.08em}
.src{font-size:12px;color:var(--muted);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src b{color:var(--warn-fg);font-weight:600}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{font:inherit;font-weight:600;font-size:13.5px;border:0;background:transparent;color:var(--muted);padding:8px 0;border-radius:7px;cursor:pointer;position:relative}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.tabs .dot{position:absolute;top:5px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--brass)}
main{padding-top:14px;display:flex;flex-direction:column;gap:14px}
section{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
h2{font-size:15px;margin:0;font-weight:700}
h3{font-size:13px;margin:0;color:var(--muted);font-weight:600}
.note{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
textarea,input,select{width:100%;font:16px/1.4 var(--font-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0}
textarea{resize:vertical;min-height:70px}
input[type=file]{padding:7px;font-size:14px}
textarea:focus,input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px}
.btn.small{font-size:12.5px;padding:5px 10px;border-radius:999px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btngrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.chip{flex:none;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{opacity:.6;margin-left:3px}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid rgba(127,127,127,.5)}
.tag{font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;background:var(--tag-bg);color:var(--tag-fg);border:1px solid var(--brass);border-radius:4px;padding:0 6px;letter-spacing:.04em;white-space:nowrap}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.warn{background:var(--warn-bg);color:var(--warn-fg)} .pill.ok{background:var(--ok-bg);color:var(--ok-fg)}
.msg{border-radius:10px;padding:9px 12px;font-size:14px;white-space:pre-wrap}
.msg.ok{background:var(--ok-bg);color:var(--ok-fg)} .msg.warn{background:var(--warn-bg);color:var(--warn-fg)} .msg.err{background:var(--err-bg);color:var(--err-fg)}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
/* item rows */
.irow{display:flex;gap:10px;align-items:center;min-width:0}
.thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--barbg);flex:none}
.thumb.none{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);text-align:center}
.itext{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.itext .l1{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.itext .nm{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.piece{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.piece:first-child{border-top:0}
.piece.found .irow{opacity:.45}
.iconbtn{flex:none;font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 9px;cursor:pointer}
.iconbtn.check{width:38px;padding:6px 0;font-size:15px}
.iconbtn.check[aria-pressed="true"]{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-fg)}
/* plates */
.plates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.plate{position:relative;display:flex;flex-direction:column;align-items:stretch;padding:0;overflow:hidden;border:1px solid #0002;border-radius:6px;color:#28332b;text-align:left;background:var(--field);font:inherit;cursor:pointer;min-width:0}
.plate0{--field:#dfcdbb}.plate1{--field:#d7dcca}.plate2{--field:#d1d9da}
.plate.selected{border-color:var(--accent);box-shadow:inset 0 -3px var(--accent)}
.plate svg{height:clamp(150px,42vw,250px);width:100%;display:block;padding:16px 0 0}
.plate.big{cursor:zoom-in}
.plate.big svg{height:min(50vh,400px);padding:22px 0 4px}
.plate.mini svg{height:120px;padding:6px 0 0}
.plate-tag{position:absolute;top:6px;left:7px;font:600 9px/1.2 ui-monospace,Menlo,monospace;letter-spacing:1px}
.plate.big .plate-tag{font-size:11px;top:10px;left:12px}
.plate-fav{position:absolute;top:6px;right:8px;font-size:14px;color:#9a7428}
.plate-footer{padding:6px 7px 8px;display:flex;flex-direction:column;gap:4px;border-top:1px solid #0002;min-width:0}
.plate-footer strong{font-size:12px;line-height:1.3;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fabric{display:flex;gap:2px}.fabric i{width:10px;height:7px;border:1px solid #0002}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:1}
.seg button{flex:1;font:inherit;font-size:13px;border:0;background:var(--surface);color:var(--fg);padding:7px 4px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.sty{display:flex;align-items:center;gap:8px;font-size:13px}.sty>span{width:46px;color:var(--muted);flex:none}
details.fold{border-top:1px solid var(--line);padding-top:8px}
details.fold>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);list-style:none;display:flex;justify-content:space-between}
details.fold>summary::after{content:"펼치기";font-weight:500}
details.fold[open]>summary::after{content:"접기"}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>.inner{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.flat{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.flat img,.flat .noimg{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px;background:var(--barbg);display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--muted)}
.actionbar{display:grid;grid-template-columns:auto 1fr;gap:8px}
/* journal */
.rec{display:flex;flex-direction:column;gap:8px}
.rechead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rechead .d{font-size:12px;color:var(--muted)}
.rechead b{font-size:15px}
.score{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.score small{font-size:12px;color:var(--muted);font-weight:500}
.recbody{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:start}
.recbody .plate{width:92px}
.strip{display:flex;gap:4px;flex-wrap:wrap}
.strip .thumb{width:40px;height:40px}
.review p{margin:4px 0;font-size:13px;white-space:pre-wrap}
.review b{font-size:12px;color:var(--muted)}
/* closet */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:640px){.cgrid{grid-template-columns:repeat(3,1fr)}}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0;font:inherit;color:inherit;text-align:left;padding:0;cursor:pointer;position:relative}
.ccard.sel{outline:3px solid var(--accent);outline-offset:-3px}
.ccard img,.ccard .noimg{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--barbg);display:block}
.ccard .noimg{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.ccard .cb{padding:7px 9px 9px;display:flex;flex-direction:column;gap:3px;min-width:0}
.ccard .cb .l1{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.ccard .nm{font-size:13px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.ccard .selmark{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.ccard.sel .selmark{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.floatbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;gap:8px;background:var(--fg);color:var(--bg);border-radius:999px;padding:6px 6px 6px 16px;align-items:center;box-shadow:0 6px 20px #0003;max-width:calc(100% - 32px)}
.floatbar .btn{border-radius:999px}
.dl{display:grid;grid-template-columns:84px 1fr;gap:4px 10px;font-size:13.5px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;overflow-wrap:anywhere}
.gallery{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory}
.gallery img{height:240px;width:auto;max-width:85%;object-fit:cover;border-radius:10px;scroll-snap-align:start;background:var(--barbg);cursor:zoom-in}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.compare .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.compare img,.compare .noimg{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:var(--barbg);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.compare .k{font-size:11px;color:var(--muted)}
.compare .v{font-size:13px;overflow-wrap:anywhere}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .k{font-size:12px;color:var(--muted)}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 90px 34px;gap:8px;align-items:center;font-size:13px}
.brow .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bar{height:8px;background:var(--barbg);border-radius:4px;overflow:hidden}
.brow .bar i{display:block;height:100%;background:var(--accent)}
.brow .bv{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
/* forms */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.score10{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.score10 button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:6px 0;cursor:pointer;min-width:0}
.score10 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.dim{display:flex;flex-direction:column;gap:4px}
.dim>span{font-size:12px;color:var(--muted)}
.photos{display:flex;gap:6px;flex-wrap:wrap}
.photos .ph{position:relative}
.photos img{width:72px;height:72px;object-fit:cover;border-radius:8px;display:block}
.photos .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);font-size:13px;cursor:pointer}
/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--bg);width:100%;max-width:760px;max-height:90vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:10px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet .body{overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:0;padding-bottom:4px}
#picker{z-index:25}
.opt{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:6px 8px;cursor:pointer;width:100%}
#lb{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(8px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(8px,env(safe-area-inset-left,0px))}
#lb .lbtop{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:4px 4px 8px;gap:8px}
#lb .lbtop button{font:inherit;font-size:15px;background:#ffffff22;color:#fff;border:0;border-radius:8px;padding:6px 14px;cursor:pointer}
#lb .lbimgs{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;min-height:0}
#lb .lbimgs img{flex:none;width:100%;height:100%;object-fit:contain;scroll-snap-align:center}
#lb .lbimgs svg{flex:none;width:100%;height:100%;background:#dfcdbb;border-radius:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px)}
[hidden]{display:none!important}
</style>

<header><div class="hrow">
  <div class="top"><h1>헤리티지 옷장<small>MOBILE</small></h1><div class="src" id="srcText"></div></div>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="look" type="button">룩북</button>
    <button role="tab" data-tab="journal" type="button">일지</button>
    <button role="tab" data-tab="closet" type="button">옷장</button>
    <button role="tab" data-tab="stats" type="button">통계</button>
    <button role="tab" data-tab="sync" type="button">백업</button>
  </div>
</div></header>

<div class="wrap"><main>
  <section id="sec-look"></section>
  <section id="sec-journal" hidden></section>
  <section id="sec-closet" hidden>
    <div class="panel">
      <div class="row"><input type="search" id="q" placeholder="ID나 이름으로 찾기" autocomplete="off" style="flex:1"><button class="btn" type="button" data-act="newItem">＋ 새 옷</button></div>
      <div class="chips" id="catChips"></div>
      <div class="chips" id="colorChips"></div>
      <div class="row spread"><div class="chips" id="statusChips"></div><button class="btn small" type="button" id="cmpMode" data-act="cmpMode" aria-pressed="false">비교</button></div>
    </div>
    <p class="note" id="closetCount"></p>
    <div class="cgrid" id="closet"></div>
  </section>
  <section id="sec-stats" hidden></section>
  <section id="sec-sync" hidden></section>
</main></div>

<div class="floatbar" id="cmpBar" hidden><span id="cmpText"></span><button class="btn small primary" type="button" data-act="cmpOpen">비교하기</button><button class="btn small" type="button" data-act="cmpClear">취소</button></div>
<div class="sheet" id="sheet" hidden><div class="box"><div class="grab"></div><div class="top"><h2 id="sheetTitle"></h2><button class="btn small" type="button" data-act="closeSheet">닫기</button></div><div class="body" id="sheetBody"></div></div></div>
<div class="sheet" id="picker" hidden><div class="box"><div class="grab"></div><div class="top"><h2 id="pickTitle">옷 고르기</h2><button class="btn small" type="button" data-act="closePicker">닫기</button></div>
  <input type="search" id="pickQ" placeholder="ID나 이름으로 찾기" autocomplete="off"><div class="chips" id="pickCats"></div><div class="body" id="pickList"></div></div></div>
<div id="lb" hidden><div class="lbtop"><span id="lbTitle"></span><button type="button" data-act="closeLb">닫기</button></div><div class="lbimgs" id="lbImgs"></div></div>
<div id="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

// ================= store: db when available, else this browser =================
// collections: changes (pending edits to bring into the sheet), favorites. doc app/snapshot (optional fresher data written by Claude)
const Store={db:null,mem:{changes:{},favorites:{}},
  async init(){
    try{const db=null;if(db){this.db=db;
      const tm=setTimeout(()=>{},10000);
      for(const c of ["changes","favorites"]){const s=await db.collection(c).get();this.mem[c]={};s.docs.forEach(d=>this.mem[c][d.id]=d.data())}
      try{const s=await db.doc("app/snapshot").get();if(s.exists)applyRemoteSnapshot(s.data())}catch(e){}
      clearTimeout(tm);return}}catch(e){this.db=null}
    this.mem.changes=lsGet("changes",{});this.mem.favorites=lsGet("favorites",{});
  },
  all(c){return Object.entries(this.mem[c]).map(([id,v])=>({_id:id,...v}))},
  get(c,id){return this.mem[c][id]},
  async set(c,id,v){this.mem[c][id]=v;if(this.db){await this.db.collection(c).doc(id).set(v)}else lsSet(c,this.mem[c])},
  async del(c,id){delete this.mem[c][id];if(this.db){await this.db.collection(c).doc(id).delete()}else lsSet(c,this.mem[c])},
};
let ASSETS=null, DOWNLOADS=null; const LOCALPH=new Map();
const IDB={db:null,open(){return new Promise((ok,no)=>{const q=indexedDB.open("heritage",1);q.onupgradeneeded=()=>q.result.createObjectStore("photos");q.onsuccess=()=>{this.db=q.result;ok()};q.onerror=()=>no(q.error)})},
  tx(m){return this.db.transaction("photos",m).objectStore("photos")},
  put(k,v){return new Promise((ok,no)=>{const q=this.tx("readwrite").put(v,k);q.onsuccess=()=>ok();q.onerror=()=>no(q.error)})},
  all(){return new Promise((ok,no)=>{const s=this.tx("readonly"),ks=s.getAllKeys(),vs=s.getAll();vs.onsuccess=()=>ok(ks.result.map((k,i)=>[k,vs.result[i]]));vs.onerror=()=>no(vs.error)})}};
function shrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=1200,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error("x")),"image/jpeg",0.82)};im.onerror=no;im.src=u})}
const LocalAssets={async upload(f){const b=await shrink(f),id=uid();await IDB.put(id,b);LOCALPH.set(id,URL.createObjectURL(b));return {id,url:"local:"+id}}};
const LocalDownloads={async save({filename,data}){const a=document.createElement("a");a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}};

let BASE_ITEMS=[], ITEMS=[], byId=new Map(), BASE_LOG=[], LOG=[], REVIEWS={}, snapLabel=SNAPSHOT_DATE;
function rowToItem(r){const [id,cat,name,detail,season,status,note]=r;return {id,cat,name,detail:detail||"",season:season||"",status:status||"",note:note||"",...(ATTRS[id]||{})}}
function sheetLogToRec(r){
  const ids=r.ids||{};const items=[];
  const push=(id,role)=>{if(id)items.push({id,role})};
  push(ids.outer,"outer");push(ids.top,"base");push(ids.bottom,"bottom");push(ids.shoes,"shoes");push(ids.bag,"bag");
  for(const k of ["a1","a2","a3"])if(ids[k])items.push({id:ids[k],role:""});
  return {key:r.date,date:r.date,occasion:r.sit||"",rating:r.score??null,weather:{min:r.min??null,max:r.max??null,condition:r.weather||"",wind:/강풍|바람/.test(r.memo||"")?"강풍":""},items,note:r.memo||"",feedback:{},photos:[],styling:{},legacy:r.outfitId||""};
}
function applyRemoteSnapshot(s){
  // Claude can write {date, items:[{id,cat,name,detail,season,status,note,...attrs}], log:[sheet-shaped rows], reviews:[...]} to app/snapshot
  if(!s||!Array.isArray(s.items)||s.items.length<10)return;
  BASE_ITEMS=s.items.map(o=>({...(ATTRS[o.id]||{}),...o}));
  if(Array.isArray(s.log))BASE_LOG=s.log.map(sheetLogToRec);
  if(Array.isArray(s.reviews))REVIEWS=Object.fromEntries(s.reviews.map(r=>[r.date,r]));
  snapLabel=s.date||snapLabel;
}
function rebuild(){
  const ch=Store.all("changes");
  const items=BASE_ITEMS.map(x=>({...x}));const idx=new Map(items.map((x,i)=>[x.id,i]));
  for(const c of ch.filter(c=>c.kind==="item")){const d=c.data;if(!d||!d.id)continue;
    const v={...d,pending:c.status!=="synced"};if(idx.has(d.id))items[idx.get(d.id)]={...items[idx.get(d.id)],...v};else{idx.set(d.id,items.length);items.push(v)}}
  ITEMS=items;byId=new Map(ITEMS.map(i=>[i.id,i]));
  const log=new Map(BASE_LOG.map(r=>[r.date,{...r}]));
  // synced changes stay merged (the sheet has no columns for detail scores, tags or photos), just without the "반영 대기" mark
  for(const c of ch.filter(c=>c.kind==="record")){const d=c.data;if(!d||!d.date)continue;const b=log.get(d.date);
    // pending: app edit wins. synced: the sheet is the source again (the user may have edited it), keep only photos/styling from the app
    log.set(d.date,c.status==="synced"&&b?{...b,photos:d.photos||[],styling:d.styling||b.styling||{},key:d.date,synced:true}:{...(b||{}),...d,key:d.date,pending:c.status!=="synced",synced:c.status==="synced"})}
  for(const c of ch.filter(c=>c.kind==="record-delete"))log.delete(c.data?.date);
  LOG=[...log.values()].sort((a,b)=>b.date.localeCompare(a.date));
}
function pendingCount(){return Store.all("changes").filter(c=>c.status!=="synced").length}
function photos(id){const it=byId.get(id);const own=(it?.uploads||[]).map(u=>safeUrl(u.url)).filter(Boolean);const n=PHOTOS[id]||0;return [...own,...Array.from({length:n},(_,k)=>`img/${id}_${k+1}.jpg`)]}
const wearable=it=>it&&it.status==="보유"&&(!it.availability||it.availability==="착용 가능");
function wearCounts(){const m=new Map();for(const r of LOG)for(const x of new Set((r.items||[]).map(i=>i.id)))m.set(x,(m.get(x)||0)+1);return m}
function lastWorn(id){const r=LOG.find(r=>(r.items||[]).some(i=>i.id===id));return r?r.date:""}
function rolesOf(id){const it=byId.get(id);if(!it)return ["other"];return (it.roles&&it.roles.length?it.roles:CAT_ROLES[it.cat])||["other"]}
function withRoles(items){
  const out=items.filter(x=>byId.get(x.id)).map(x=>({id:x.id,role:x.role||""}));
  const outers=out.filter(x=>byId.get(x.id).cat==="아우터").length;
  for(const x of out){if(x.role)continue;const it=byId.get(x.id),sub=it.subtype||"";
    if(it.cat==="아우터")x.role=(/베스트|조끼/.test(sub)&&outers>1)?"mid":"outer";
    else if(it.cat==="상의")x.role=/베스트|조끼|가디건/.test(sub)?"mid":"base";
    else x.role=rolesOf(x.id)[0];}
  if(!out.some(x=>x.role==="base")){const m=out.find(x=>x.role==="mid"&&byId.get(x.id).cat==="상의");if(m&&out.filter(x=>x.role==="mid").length>1)m.role="base"}
  return out;
}

const isVest=it=>/베스트|조끼/.test((it.subtype||"")+(it.name||""));
const isThick=it=>!isVest(it)&&(/니트|스웨터/.test((it.subtype||"")+(it.name||""))&&!/가디건/.test(it.subtype||"")&&(it.warmth||0)>=6);
function layerWarn(sel){const tops=sel.filter(x=>["base","mid"].includes(x.role)).map(x=>byId.get(x.id)).filter(Boolean);const w=[];
  const nonVest=tops.filter(it=>!isVest(it));
  if(nonVest.length>1)w.push(`조끼가 아닌 상의가 ${nonVest.length}장이에요 (${nonVest.map(i=>i.id).join(", ")}). 상의는 한 장, 또는 셔츠+조끼만 입어요.`);
  if(tops.some(isVest)&&tops.some(isThick))w.push(`두꺼운 니트(${tops.filter(isThick).map(i=>i.id).join(", ")}) 위에는 조끼를 입지 않아요.`);
  return w}

function parsePlans(text){
  text=(text||"").trim();if(!text)return {plans:[],err:"붙여넣은 내용이 없어요."};
  text=text.replace(/^```[a-z]*\s*/i,"").replace(/```\s*$/,"").trim();
  if(text[0]==="{"||text[0]==="["){
    let j;try{j=JSON.parse(text)}catch(e){return {plans:[],err:"JSON 형식이 깨져 있어요. 채팅에서 받은 그대로 다시 붙여넣어 주세요."}}
    const arr=Array.isArray(j)?j:(j.outfits||[]);
    return {plans:arr.map((o,i)=>({name:String(o.name||`${i+1}안`),reason:String(o.reason||""),plan_id:String(o.plan_id||""),
      items:(o.items||[]).map(x=>typeof x==="string"?{id:x.toUpperCase(),role:""}:{id:String(x.id||"").toUpperCase(),role:ROLE[x.role]?x.role:""}).filter(x=>x.id),
      styling:o.styling&&typeof o.styling==="object"?{outer:o.styling.outer,hem:o.styling.hem,scarf:o.styling.scarf}:{},found:[]})).filter(p=>p.items.length)};
  }
  const m=text.match(/#fit-([A-Z0-9-]+)/i);if(m)text=m[1].replace(/-/g," ");
  const lines=text.split(/\n+/).map(l=>(l.toUpperCase().match(/\b[OTBSA]\d{2}\b/g)||[])).filter(a=>a.length);
  return {plans:lines.map((ids,i)=>({name:lines.length>1?`${i+1}안`:"코디",reason:"",items:ids.map(id=>({id,role:""})),styling:{},found:[]}))};
}

    ${panel("많이 입은 옷",top.length?bars(top.map(([id,v])=>[nm(id),v]),top[0][1]):`<div class="empty">기록이 없어요.</div>`)}
    ${panel("아우터별 착용 일수",outerRows.length?bars(outerRows.map(([id,v])=>[nm(id),v]),outerRows[0][1]):`<div class="empty">기록이 없어요.</div>`)}
    ${panel("만족도 기록",LOG.filter(r=>Number(r.rating)>0).length?bars(LOG.filter(r=>Number(r.rating)>0).slice(0,10).map(r=>[esc(r.date.slice(5))+` <span class="note">${esc(r.weather?.min??"?")}~${esc(r.weather?.max??"?")}℃</span>`,Number(r.rating),r.rating+"점"]),10):`<div class="empty">아직 점수가 없어요.</div>`)}
    ${panel("보유 옷 주색 분포",bars(colorRows.map(([k,v])=>[`<span class="sw" style="background:${color(k)}"></span>${esc(clabel(k))}${wornColor[k]?` <span class="note">· 입은 ${wornColor[k]}</span>`:""}`,v]),colorRows[0]?.[1]||1))}
    ${panel("분류별 안 입은 옷",`<p class="note">안 입은 수 / 보유 수</p>`+catRows.map(([c,n,u])=>`<div class="brow"><span class="bn">${esc(c)}</span><span class="bar"><i style="width:${Math.round(u/n*100)}%"></i></span><span class="bv">${u}/${n}</span></div>`).join(""))}
    ${panel("비·눈 오는 날 착장",rain.length?rain.map(r=>`<div class="note">${esc(r.date.slice(5))} · ${(r.items||[]).map(i=>esc(i.id)).join(" ")}</div>`).join(""):`<div class="empty">기록이 없어요.</div>`)}`;
}

// ================= 백업 · 반영 =================
function changeSummary(c){const d=c.data||{};
  if(c.kind==="record")return `착장 기록 ${d.date} · ${(d.items||[]).map(i=>i.id).join(" ")}${d.rating?` · ${d.rating}점`:""}${d.photos?.length?` · 사진 ${d.photos.length}`:""}`;
  if(c.kind==="record-delete")return `착장 기록 ${d.date} 지우기`;
  if(c.kind==="item")return `${c.isNew?"새 옷":"옷 정보 수정"} ${d.id} ${d.name||""}${d.status&&d.status!=="보유"?` · ${d.status}`:""}`;
  return c.kind}
function renderSync(){
  const ch=Store.all("changes").filter(c=>c.status!=="synced").sort((a,b)=>(a.at||"").localeCompare(b.at||""));
  const where=Store.db?"이 앱의 저장 공간(다른 기기에서 열어도 같아요)":"이 휴대폰 브라우저 (다른 기기와 공유 안 돼요)";
  $("sec-sync").innerHTML=`
    <div class="panel"><h2>시트 반영 대기 · ${ch.length}건</h2>
      ${ch.length?`<p class="note"><b>① 기록 복사</b>를 눌러 Claude 채팅에 붙여넣으면 시트에 옮겨 드려요. 옮겼다고 답이 오면 <b>② 반영 완료로 표시</b>를 눌러 주세요.</p>
        ${ch.map(c=>`<div class="piece"><div class="itext"><div class="nm">${esc(changeSummary(c))}</div><div class="l1">${esc((c.at||"").slice(0,16).replace("T"," "))}</div></div><button class="iconbtn" type="button" data-act="chDel" data-id="${esc(c._id)}">취소</button></div>`).join("")}
        <div class="btngrid"><button class="btn primary" type="button" data-act="copyChanges">① 기록 복사</button><button class="btn" type="button" data-act="markSynced">② 반영 완료로 표시</button></div>`
      :`<p class="note">반영할 내용이 없어요. 앱에서 기록·평가·옷 정보를 저장하면 여기에 쌓여요.</p>`}
      <div id="copyOut"></div></div>
    ${(()=>{const done=Store.all("changes").filter(c=>c.status==="synced").sort((a,b)=>(b.syncedAt||b.at||"").localeCompare(a.syncedAt||a.at||"")).slice(0,10);
      return done.length?`<div class="panel"><h2>시트 반영 완료 · 최근 ${done.length}건</h2><p class="note">시트에 옮긴 내용이에요. 앱에서는 "시트 반영됨"으로 보여요.</p>${done.map(c=>`<div class="piece"><div class="itext"><div class="nm">${esc(changeSummary(c))}</div><div class="l1"><span class="pill ok">반영됨</span>${esc((c.syncedAt||"").slice(0,16).replace("T"," "))}</div></div></div>`).join("")}</div>`:""})()}
    <div class="panel"><h2>백업</h2>
      <p class="note">저장한 코디·반영 대기 내용·불러온 추천을 파일 하나로 받아 둘 수 있어요.</p>
      <div class="btngrid"><button class="btn" type="button" data-act="exportB">백업 파일 받기</button><button class="btn" type="button" data-act="importB">백업 불러오기</button></div><div id="bkMsg"></div></div>
    <div class="panel"><h2>중요: 백업</h2><p class="note">기록과 사진은 이 휴대폰 안에만 저장돼요. 앱을 지우거나 브라우저 데이터를 지우면 사라지니, 가끔 <b>백업 파일 받기</b>를 눌러 두세요. (사진은 백업 파일에 들어가지 않아요.)</p></div>
    <div class="panel"><h2>데이터 기준</h2>
      <dl class="dl"><dt>옷장·일지</dt><dd>옷장 시트 ${esc(snapLabel)} 기준 · 옷 ${ITEMS.length}개 · 기록 ${LOG.length}일</dd><dt>앱 저장</dt><dd>${esc(where)}</dd><dt>사진</dt><dd>${ASSETS?"올릴 수 있어요":"이 화면에서는 못 올려요"}</dd></dl>
      <p class="note">기준 데이터는 옷장 시트예요. 시트가 바뀌면 채팅에서 "앱 갱신해줘"라고 해 주세요. 갱신된 앱은 인터넷에 연결된 상태로 열면 받아져요.</p></div>`;
}
function changesText(){const ch=Store.all("changes").filter(c=>c.status!=="synced");
  return "앱 기록 시트에 반영해줘\n"+ch.map(c=>{const d=c.data||{};
    if(c.kind==="record"){const w=d.weather||{};return `- 착장 ${d.date}(${dowOf(d.date)}) ${d.occasion||""} | ${w.condition||""} ${w.min??"?"}~${w.max??"?"}℃ ${w.wind||""} | ${withRoles(d.items||[]).map(i=>i.id+"("+(ROLE[i.role]||"")+")").join(" ")} | 만족도 ${d.rating??"-"}${d.note?" | 메모 "+d.note:""}`}
    if(c.kind==="record-delete")return `- 착장 ${d.date} 기록 삭제`;
    if(c.kind==="item")return `- ${c.isNew?"새 옷":"수정"} ${d.id} ${d.cat} "${d.name}" | 세부 ${d.subtype||"-"} | 색 ${(d.colors||[]).map(clabel).join("/")} | 패턴 ${d.pattern} | 핏 ${d.fit} | 보온 ${d.warmth??"-"} | 상태 ${d.status} | 상세 ${d.detail||"미확인"}${d.note?" | 비고 "+d.note:""}`;
    return ""}).join("\n")}
async function exportBackup(){
  const data={app:"heritage-mobile",version:1,exported:new Date().toISOString(),snapshot:snapLabel,changes:Store.mem.changes,favorites:Store.mem.favorites,plans:PLANS};
  const txt=JSON.stringify(data,null,2),name=`heritage-backup-${todayKST()}.json`;
  if(DOWNLOADS){try{await DOWNLOADS.save({filename:name,data:new Blob([txt],{type:"application/json"})});$("bkMsg").innerHTML=`<div class="msg ok">저장했어요.</div>`;return}catch(e){if(e&&e.code==="declined")return}}
  $("bkMsg").innerHTML=`<div class="msg warn">파일로 저장할 수 없어서 내용을 보여 드려요. 길게 눌러 복사해 두세요.</div><textarea readonly rows="6">${esc(txt)}</textarea>`;
}
async function importBackup(file){
  try{const j=JSON.parse(await file.text());if(j.app!=="heritage-mobile")throw 0;
    let n=0;for(const [id,v] of Object.entries(j.changes||{}))if(!Store.get("changes",id)){await Store.set("changes",id,v);n++}
    for(const [id,v] of Object.entries(j.favorites||{}))if(!Store.get("favorites",id)){await Store.set("favorites",id,v);n++}
    if(Array.isArray(j.plans)&&!PLANS.length){PLANS=j.plans;savePlans()}
    rebuild();renderTab();toast(`${n}건을 불러왔어요`);
  }catch(e){toast("백업 파일이 아니에요")}
}

// ================= sheets & lightbox =================
function openSheet(title,html){$("sheetTitle").textContent=title;$("sheetBody").innerHTML=html;$("sheet").hidden=false;$("sheetBody").scrollTop=0}
function closeSheet(){$("sheet").hidden=true;$("sheetBody").innerHTML=""}
function showLb(title,html){$("lbTitle").textContent=title;$("lbImgs").innerHTML=html;$("lb").hidden=false}
function showPhotos(id,k=0){const it=byId.get(id);showLb(`${id} ${it?it.name:""}`,photos(id).map(s=>`<img src="${esc(s)}" alt="">`).join(""));const el=$("lbImgs");requestAnimationFrame(()=>el.scrollLeft=el.clientWidth*k)}

// ================= one click handler =================
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,d=t.dataset;
  const plan=()=>PLANS[activePlan];
  switch(a){
    case "closeSheet":closeSheet();break;
    case "closePicker":$("picker").hidden=true;break;
    case "closeLb":$("lb").hidden=true;break;
    // lookbook
    case "import":openImport();break;
    case "pasteClip":try{$("planInput").value=await navigator.clipboard.readText()}catch(err){$("impMsg").innerHTML=`<div class="msg warn">클립보드를 읽지 못했어요. 칸을 길게 눌러 붙여넣어 주세요.</div>`}break;
    case "doImport":{const r=parsePlans($("planInput").value);if(r.err||!r.plans.length){$("impMsg").innerHTML=`<div class="msg err">${esc(r.err||"옷 ID를 찾지 못했어요.")}</div>`;break}
      PLANS=r.plans;activePlan=0;savePlans();closeSheet();setTab("look");toast(`${r.plans.length}가지 코디를 불러왔어요`);break}
    case "newLook":PLANS=[{name:"내 코디",reason:"",items:[],styling:{},found:[]}];activePlan=0;savePlans();renderLook();openLayers();break;
    case "saved":openSaved();break;
    case "pickPlan":activePlan=+d.i;savePlans();renderLook();break;
    case "enlarge":{const p=plan();showLb(p.name,figure(withRoles(p.items),"lb",p.styling||{}));break}
    case "view":viewMode=d.v;lsSet("viewMode",viewMode);renderLook();break;
    case "sty":{const p=plan();p.styling={...(p.styling||{}),[d.k]:d.v};savePlans();renderLook();break}
    case "found":{const p=plan(),f=new Set(p.found||[]);f.has(d.id)?f.delete(d.id):f.add(d.id);p.found=[...f];savePlans();renderLook();break}
    case "fav":{const p=plan(),k=favKey(p),ex=Store.all("favorites").find(f=>f.key===k);
      try{if(ex){await Store.del("favorites",ex._id);toast("저장을 뺐어요")}else{await Store.set("favorites","fav-"+uid(),{key:k,name:p.name,items:p.items,styling:p.styling||{},at:new Date().toISOString()});toast("저장했어요")}}catch(err){toast("저장하지 못했어요")}
      renderLook();break}
    case "openFav":{const f=Store.get("favorites",d.id);if(!f)break;PLANS=[{name:f.name||"즐겨찾기",reason:"",items:f.items,styling:f.styling||{},found:[]}];activePlan=0;savePlans();closeSheet();setTab("look");break}
    case "openRec":closeSheet();openRecord(d.date);break;
    case "swap":{const p=plan(),x=p.items[+d.n],it=byId.get(x.id);
      const cats=CATS.filter(c=>(CAT_ROLES[c]||[]).includes(x.role));
      openPicker(`${ROLE[x.role]||""} 교체`,cats.length?cats:[it.cat],id=>{p.items[+d.n]={id,role:x.role};p.found=(p.found||[]).filter(f=>f!==x.id);savePlans();renderLook()},p.items.map(i=>i.id));break}
    case "layers":openLayers();break;
    case "role":break;
    case "mv":{const p=plan(),n=+d.n,m=n+(+d.d);if(m<0||m>=p.items.length)break;[p.items[n],p.items[m]]=[p.items[m],p.items[n]];savePlans();renderLook();openLayers();break}
    case "rm":{const p=plan();p.items.splice(+d.n,1);savePlans();renderLook();openLayers();break}
    case "addToPlan":{const p=plan();openPicker("옷 추가",CATS,id=>{p.items.push({id,role:""});p.items=withRoles(p.items);savePlans();renderLook();openLayers()},p.items.map(i=>i.id));break}
    case "wearPlan":openRecord(null,plan());break;
    // picker
    case "pickCat":pickCat=d.v;renderPick();break;
    case "picked":$("picker").hidden=true;if(pickCb)pickCb(d.id);break;
    // journal
    case "newRec":openRecord(null);break;
    case "recFig":{const r=LOG.find(x=>x.date===d.date);if(r)showLb(r.date,figure(withRoles(r.items),"lb",r.styling||{}));break}
    case "recFigBig":readRecForm();showLb("예상 착샷",figure(withRoles(recDraft.items),"lb",recDraft.styling||{}));break;
    case "recPhotos":{const r=LOG.find(x=>x.date===d.date);if(r)showLb(r.date+" 착용 사진",r.photos.map(p=>`<img src="${esc(safeUrl(p.url))}" alt="">`).join(""));break}
    case "recAdd":readRecForm();openPicker("입은 옷 추가",CATS,id=>{recDraft.items.push({id,role:""});recDraft.items=withRoles(recDraft.items);renderRecord()},recDraft.items.map(i=>i.id));break;
    case "recRm":readRecForm();recDraft.items.splice(+d.n,1);renderRecord();break;
    case "recPhRm":readRecForm();recDraft.photos.splice(+d.n,1);renderRecord();break;
    case "score":{const name=d.name,v=+d.v;
      if(recDraft&&!$("sheet").hidden){readRecForm();if(name==="rating")recDraft.rating=recDraft.rating===v?null:v;else{const k=name.slice(4);recDraft.feedback.dimensions[k]=recDraft.feedback.dimensions[k]===v?null:v}
        t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.v===(name==="rating"?recDraft.rating:recDraft.feedback.dimensions[name.slice(4)]))))}break}
    case "tag":{const tg=recDraft.feedback.tags,i=tg.indexOf(d.v);i>=0?tg.splice(i,1):tg.push(d.v);t.setAttribute("aria-pressed",String(i<0));break}
    case "recSave":saveRecord();break;
    case "recDel":deleteRecord();break;
    // closet
    case "item":openItem(d.id);break;
    case "photos":showPhotos(d.id,+(d.k||0));break;
    case "cat":cst.cat=d.v;lsSet("cat",cst.cat);renderCloset();break;
    case "color":cst.color=d.v;renderCloset();break;
    case "status":cst.status=d.v;renderCloset();break;
    case "cmpMode":cst.cmp=!cst.cmp;cst.sel.clear();renderCloset();break;
    case "cmpPick":cst.sel.has(d.id)?cst.sel.delete(d.id):(cst.sel.size<4?cst.sel.add(d.id):toast("4개까지 비교할 수 있어요"));renderCloset();break;
    case "cmpOpen":openCompare();break;
    case "cmpClear":cst.cmp=false;cst.sel.clear();renderCloset();break;
    case "newItem":openItemForm(null);break;
    case "editItem":openItemForm(d.id);break;
    case "subColor":{readItemForm();const cs=itemDraft.colors,i=cs.indexOf(d.v);if(i>0)cs.splice(i,1);else if(i<0)cs.push(d.v);t.setAttribute("aria-pressed",String(i<0));break}
    case "itemPhRm":readItemForm();itemDraft.uploads.splice(+d.n,1);renderItemForm(!!byId.get(itemDraft.id)&&BASE_ITEMS.some(b=>b.id===itemDraft.id));break;
    case "itemSave":saveItem(d.edit==="1");break;
    case "addLook":{if(!PLANS.length){PLANS=[{name:"내 코디",reason:"",items:[],styling:{},found:[]}];activePlan=0}
      const p=PLANS[activePlan];if(!p.items.some(i=>i.id===d.id))p.items.push({id:d.id,role:""});p.items=withRoles(p.items);savePlans();closeSheet();setTab("look");toast(`${d.id}를 코디에 넣었어요`);break}
    // sync
    case "chDel":await Store.del("changes",d.id);rebuild();renderTab();break;
    case "copyChanges":{const txt=changesText();try{await navigator.clipboard.writeText(txt);toast("복사했어요. 채팅에 붙여넣어 주세요")}catch(err){$("copyOut").innerHTML=`<div class="msg warn">길게 눌러 전체 선택 후 복사하세요.</div><textarea readonly rows="7">${esc(txt)}</textarea>`}break}
    case "markSynced":{const now=new Date().toISOString();for(const c of Store.all("changes").filter(c=>c.status!=="synced")){const {_id,...v}=c;await Store.set("changes",_id,{...v,status:"synced",syncedAt:now})}rebuild();renderTab();toast("반영 완료로 표시했어요");break}
    case "exportB":exportBackup();break;
    case "importB":$("importFile").click();break;
  }
});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.act==="role"){const p=PLANS[activePlan];p.items[+t.dataset.n].role=t.value;savePlans();renderLook()}});
$("importFile").onchange=e=>{const f=e.target.files[0];if(f)importBackup(f);e.target.value=""};
for(const id of ["sheet","picker"])$(id).addEventListener("click",e=>{if(e.target.id===id)$(id).hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("lb").hidden=true;$("picker").hidden=true;$("sheet").hidden=true}});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

// ================= boot =================
(async function(){
  BASE_ITEMS=SNAPSHOT.map(rowToItem);BASE_LOG=SNAPSHOT_LOG.map(sheetLogToRec);REVIEWS=Object.fromEntries(SNAPSHOT_REVIEWS.map(r=>[r.date,r]));
  Store.mem.changes=lsGet("changes",{});Store.mem.favorites=lsGet("favorites",{});
  rebuild();
  const h=location.hash;if(h.startsWith("#fit-")){const r=parsePlans(h);if(r.plans.length){PLANS=r.plans;activePlan=0;savePlans();tab="look"}}
  setTab(["look","journal","closet","stats","sync"].includes(tab)?tab:"look");
  await Store.init();
  try{await IDB.open();for(const [k,b] of await IDB.all())LOCALPH.set(k,URL.createObjectURL(b));ASSETS=LocalAssets}catch(e){}
  DOWNLOADS=LocalDownloads;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  rebuild();renderTab();
})();
</script>
